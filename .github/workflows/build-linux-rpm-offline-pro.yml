name: Build Linux RPM Offline Pro

on:
  workflow_dispatch:
  push:
    branches:
      - offline-pro-windows

permissions:
  contents: read

jobs:
  build-linux-rpm:
    name: Build Linux RPM x64
    runs-on: ubuntu-22.04
    env:
      BUILD_TAG: v0.24.2-offline-pro
      STABLE_RELEASE: "true"
      NEXT_PUBLIC_TURNSTILE: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev pkg-config xdg-utils rpm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workdir: ./src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm exec next build

      - name: Build sidecar binaries
        working-directory: ./src-tauri
        run: |
          cargo build --bin donut-proxy --target x86_64-unknown-linux-gnu --release
          cargo build --bin donut-daemon --target x86_64-unknown-linux-gnu --release

      - name: Copy sidecar binaries
        run: |
          mkdir -p src-tauri/binaries
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/donut-proxy src-tauri/binaries/donut-proxy-x86_64-unknown-linux-gnu
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/donut-daemon src-tauri/binaries/donut-daemon-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/donut-proxy-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/donut-daemon-x86_64-unknown-linux-gnu

      - name: Disable Tauri beforeBuildCommand
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.build.beforeBuildCommand=''; c.bundle.targets=['rpm']; fs.writeFileSync(p, JSON.stringify(c, null, 2));"

      - name: Build Tauri RPM
        run: pnpm exec tauri build --target x86_64-unknown-linux-gnu --bundles rpm --verbose

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: donut-offline-pro-linux-rpm-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
